name: retag
# One-off: after main's history was rewritten, point every release tag at the
# rewritten commit with the same file tree. Removed again right after it ran.
on:
  push:
    branches: [main]
    paths: [.github/workflows/retag.yml]
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch --tags --force origin
          git log origin/main --format='%T %H' > map.txt
          for t in $(git tag); do
            tree=$(git rev-parse "$t^{tree}")
            new=$(awk -v t="$tree" '$1==t{print $2; exit}' map.txt)
            [ -z "$new" ] && { echo "$t: no match"; continue; }
            [ "$(git rev-parse "$t^{commit}")" = "$new" ] && continue
            git tag -f "$t" "$new" && git push -f origin "refs/tags/$t" && echo "$t -> $new"
          done
