services:
  psadt-frontend:
    build: .
    image: psadt-frontend:0.1.11
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - psadt-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  psadt-data:
